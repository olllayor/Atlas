<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `blob:` in connect-src is load-bearing, not housekeeping: a staged
      attachment is held as a blob URL and has to be read back with fetch() to
      become the data URL the main process stores. blob: is not covered by
      'self', so without it every send carrying a file failed in the main
      process with "Attachments must be sent as data URLs" — the conversion had
      been silently blocked one layer up.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: atlas-attachment: https://models.dev https://*.posthog.com; connect-src 'self' blob: data: atlas-attachment: http://localhost:* ws://localhost:* https://*.posthog.com https://us-assets.i.posthog.com https://us.i.posthog.com; font-src 'self'; frame-src 'self' atlas-site:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <!-- Inlined so the icon needs no asset request and no CSP host: the
         renderer is also opened in a plain browser during development,
         where an untitled default favicon is the only thing on the tab. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%222.5%22%20y%3D%222.5%22%20width%3D%2219%22%20height%3D%2219%22%20rx%3D%225.5%22%20fill%3D%22%231c1917%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23faf9f7%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M7.7%2017.4%2012%206.6%2016.3%2017.4%22%2F%3E%3Cpath%20d%3D%22M9.55%2014.6H14.45%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
    <!--
      The Geist Mono webfont link and its two Google Fonts preconnects used
      to live here. Nothing in the app ever referenced Geist: every theme's
      --font-mono-system falls through to Menlo/SF Mono. The two
      fonts.googleapis.com / fonts.gstatic.com CSP allowances went with it,
      since no remaining stylesheet or font request targets either host.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
