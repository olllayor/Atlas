name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  pr-base:
    name: PR base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow only release PRs into main
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          if [ "$base" = "main" ] && [ "$head" != "dev" ]; then
            echo "Feature and fix PRs target dev. Only the release PR (dev → main) may target main."
            exit 1
          fi
          echo "base=$base head=$head ok"

  verify:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # keytar links libsecret on Linux; without it every test that touches
      # the keychain fails at dlopen with ERR_DLOPEN_FAILED.
      - name: Install Linux keychain libs
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  package-macos:
    name: Package (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # arm64-only for PR CI speed; dual-arch packaging is release.yml's job.
      - name: Package arm64 (unsigned)
        run: |
          pnpm run icons:mac
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --arm64 --publish never

      - name: List release artifacts
        run: ls -la release/
