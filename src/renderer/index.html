<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `blob:` in connect-src is load-bearing, not housekeeping: a staged
      attachment is held as a blob URL and has to be read back with fetch() to
      become the data URL the main process stores. blob: is not covered by
      'self', so without it every send carrying a file failed in the main
      process with "Attachments must be sent as data URLs" — the conversion had
      been silently blocked one layer up.

      The app's own schemes belong in connect-src as well as img-src, spelled
      exactly as they are registered: an image the renderer shows is also an
      image the user can right-click and copy or save, and that path reads the
      bytes back with fetch().
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: atlas-attachment: atlas-native-app-icon: atlas-plugin-icon: https://models.dev https://*.posthog.com https://open-vsx.org https://*.open-vsx.org https://openvsx.eclipsecontent.org https://*.eclipsecontent.org https://github.com https://*.githubusercontent.com https://www.google.com; connect-src 'self' blob: data: atlas-attachment: atlas-native-app-icon: atlas-plugin-icon: http://localhost:* ws://localhost:* https://*.posthog.com https://us-assets.i.posthog.com https://us.i.posthog.com https://open-vsx.org https://*.open-vsx.org https://openvsx.eclipsecontent.org https://*.eclipsecontent.org; font-src 'self'; frame-src 'self' atlas-site: atlas-widget:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <!-- Inlined so the icon needs no asset request and no CSP host: the
         renderer is also opened in a plain browser during development,
         where an untitled default favicon is the only thing on the tab. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%222.5%22%20y%3D%222.5%22%20width%3D%2219%22%20height%3D%2219%22%20rx%3D%225.5%22%20fill%3D%22%231c1917%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23faf9f7%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M7.7%2017.4%2012%206.6%2016.3%2017.4%22%2F%3E%3Cpath%20d%3D%22M9.55%2014.6H14.45%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
    <!--
      The Geist Mono webfont link and its two Google Fonts preconnects used
      to live here. Nothing in the app ever referenced Geist: every theme's
      --font-mono-system falls through to Menlo/SF Mono. The two
      fonts.googleapis.com / fonts.gstatic.com CSP allowances went with it,
      since no remaining stylesheet or font request targets either host.
    -->
    <!--
      Theme stamp and static shell paint before any module script. The stamp
      mirrors `earlyThemeStamp.ts` for the attributes the CSS needs; palette
      variables still come from `stampCachedTheme()` once the bundle loads.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('atlas.theme-mode') || 'system';
          var design = localStorage.getItem('atlas.design-theme') || 'atlas';
          var themeId = localStorage.getItem('atlas.theme-id');
          var prefersDark = window.matchMedia
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          root.classList.toggle('dark', resolved === 'dark');
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-design-theme', design);
          root.style.colorScheme = resolved;
          if (themeId) root.setAttribute('data-theme-id', themeId);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical shell only: full viewport, titlebar, sidebar, empty transcript,
         composer frame. Atlas tokens inlined so the first paint is themed
         before styles.css lands. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #060709;
        color: #fafafa;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #fcfcfc;
        color: #09090b;
      }
      #boot-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: #09090b;
      }
      html[data-theme='light'] #boot-shell {
        background: #fcfcfc;
      }
      .boot-titlebar {
        height: 52px;
        flex: 0 0 52px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: #101013;
      }
      html[data-theme='light'] .boot-titlebar {
        border-bottom-color: rgba(9, 9, 11, 0.06);
        background: #f4f4f5;
      }
      .boot-body {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .boot-sidebar {
        width: 284px;
        flex: 0 0 284px;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        background: #101013;
        padding: 12px;
        box-sizing: border-box;
      }
      html[data-theme='light'] .boot-sidebar {
        border-right-color: rgba(9, 9, 11, 0.06);
        background: #f4f4f5;
      }
      .boot-block {
        height: 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
        margin-bottom: 10px;
      }
      html[data-theme='light'] .boot-block {
        background: rgba(9, 9, 11, 0.06);
      }
      .boot-main {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
      }
      .boot-transcript {
        flex: 1 1 auto;
        min-height: 0;
      }
      .boot-composer {
        flex: 0 0 auto;
        margin: 0 auto 20px;
        width: min(100% - 48px, 55rem);
        height: 88px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 28px;
        background: #141417;
        box-sizing: border-box;
      }
      html[data-theme='light'] .boot-composer {
        border-color: rgba(9, 9, 11, 0.09);
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- Replaced wholesale when React mounts. Skeleton blocks only: no fake
         conversation rows that would lie about local data. -->
    <div id="root">
      <div id="boot-shell" aria-hidden="true">
        <div class="boot-titlebar"></div>
        <div class="boot-body">
          <div class="boot-sidebar">
            <div class="boot-block" style="width: 60%"></div>
            <div class="boot-block" style="width: 82%"></div>
            <div class="boot-block" style="width: 70%"></div>
            <div class="boot-block" style="width: 76%"></div>
            <div class="boot-block" style="width: 54%"></div>
          </div>
          <div class="boot-main">
            <div class="boot-transcript"></div>
            <div class="boot-composer"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
