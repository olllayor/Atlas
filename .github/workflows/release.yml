name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # node-gyp 9 (via electron-builder install-app-deps) needs distutils,
      # gone from Python 3.12+. macos-latest ships 3.12+, so pin 3.11 for
      # the node-pty source rebuild.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Unsigned remains the default when no Developer ID cert is configured.
      # Signed (and optionally notarized) packaging runs only when secrets exist.
      - name: Detect signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS artifacts (unsigned)
        if: steps.signing.outputs.signed != 'true'
        run: pnpm package

      - name: Package macOS artifacts (signed)
        if: steps.signing.outputs.signed == 'true' && steps.signing.outputs.notarize != 'true'
        run: pnpm package:signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}

      - name: Package macOS artifacts (signed + notarized)
        if: steps.signing.outputs.notarize == 'true'
        run: |
          # APPLE_API_KEY must be a filesystem path to the .p8 key file.
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export APPLE_API_KEY="$KEY_PATH"
          pnpm package:notarized
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Always runs. Informational for unsigned builds; strict when signed.
      # Note: macOS runners ship bash 3.2 — avoid mapfile/associative arrays.
      - name: Verify macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== release/ contents ==="
          ls -la release/

          APP_LIST=$(find release -type d -name 'Atlas.app' | sort)
          if [ -z "$APP_LIST" ]; then
            echo "::error::Atlas.app not found under release/"
            exit 1
          fi

          echo "$APP_LIST" | while IFS= read -r APP; do
            [ -z "$APP" ] && continue
            echo ""
            echo "=== codesign -dv: $APP ==="
            # Informational when unsigned; do not fail the job here.
            codesign -dv --verbose=2 "$APP" 2>&1 || true

            AUTHORITY=$(codesign -dv --verbose=2 "$APP" 2>&1 || true)
            if echo "$AUTHORITY" | grep -q 'Authority=Developer ID Application'; then
              echo "=== codesign --verify --deep --strict: $APP ==="
              codesign --verify --deep --strict --verbose=2 "$APP"
              echo "=== spctl assess: $APP ==="
              spctl --assess --type execute --verbose=4 "$APP"
            else
              echo "Unsigned or non-Developer ID build: skipping strict verify for $APP"
            fi
          done

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            release/Atlas-*.dmg
            release/Atlas-*.zip
            release/Atlas-*.dmg.blockmap
            release/Atlas-*.zip.blockmap
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
